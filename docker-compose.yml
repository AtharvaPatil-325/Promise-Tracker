version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: promisetracker-postgres
    environment:
      POSTGRES_DB: promisetracker
      POSTGRES_USER: promisetracker
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-promisetracker_secret_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promisetracker -d promisetracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promisetracker-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promisetracker
      SPRING_DATASOURCE_USERNAME: promisetracker
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-promisetracker_secret_pass}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: promisetracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
